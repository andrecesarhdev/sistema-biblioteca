name: Pipeline CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configuração do Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verificar versão do Python
        run: |
          python --version

      - name: Build
        run: |
          python -m py_compile main.py biblioteca/*.py
          echo "Build concluído com sucesso!"

  security:
    name: Seguranca (Bandit e pip-audit)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Atualizar pip e instalar dependencias
        run: |
          pip install --upgrade pip setuptools
          pip install -r requirements.txt
      - name: Executar Bandit
        run: |
          echo "Executando analise estatica de seguranca com Bandit..."
          bandit -r .
      - name: Executar pip-audit
        run: |
          echo "Verificando dependencias com pip-audit..."
          pip-audit

  test:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Executar testes automatizados
        run: |
          python -m unittest discover -s tests -v

      - name: Testes concluídos
        run: echo "Todos os testes foram executados com sucesso!"

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Simular Deploy
        run: |
          echo "DEPLOY DO SISTEMA DE BIBLIOTECA"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Deploy realizado com sucesso!"
