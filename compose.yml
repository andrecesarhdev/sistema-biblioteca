services:
  biblioteca:
    build: .
    stdin_open: true
    tty: true
    ports:
      - "8080:8080"
    volumes:
      - biblioteca-dados:/app/dados
    env_file:
      - .env # <-- Adicionando esta linha para carregar o arquivo .env automaticamente
    networks:
      - biblioteca-net

volumes:
  biblioteca-dados:

networks:
  biblioteca-net:
